# RobotTwin — 3-DOF arm parameters.
# Single source of truth: simulation, visualization, CAD, and firmware all read this file.
# Units are human-friendly here (mm, deg, g, RPM); loaders convert to SI (m, rad, kg).
# Geometry is FIXED (see docs/linkage-geometry.md). Gearboxes are the independent variables.

robot:
  name: rt-arm-3dof

links:
  base_height_mm: 90     # table -> shoulder pitch axis
  upper_arm_mm: 120      # shoulder axis -> elbow axis
  forearm_mm: 120        # elbow axis -> TCP (gripper grasp point)

joints:
  base:
    limits_deg: [-135, 135]
  shoulder:
    limits_deg: [0, 180]     # from horizontal, positive up
  elbow:
    limits_deg: [-150, 150]  # 0 = straight arm (singular boundary)

# Mass model (PETG ~30% infill estimates + purchased hardware)
masses:
  upper_arm_g: 160
  forearm_g: 120
  elbow_motor_g: 350       # NEMA 17 mounted at the elbow joint
  gripper_g: 60            # at TCP (engineering/gripper v2 SG-90: ~56 g estimate)
  payload_default_g: 100
  payload_max_g: 2000

# All three joints use the same motor (NEMA 17, 42x48)
motor:
  # 0.45 is the datasheet figure at FULL rated current (~1.5-2 A). The bench rig
  # runs tmc_uart.irun: 16 (~0.9-1.0 A), so the real number is roughly half —
  # and the governor can only respect the torque it is told about. With 0.45 it
  # timed moves the motors could not follow (stall) and approved holds the
  # shoulder could not sustain (gravity backdrive). Restore 0.45 only when the
  # motor supply moves off the breadboard and irun goes to full current.
  # Track this to irun: ~0.25 at irun 16, ~0.19 at irun 12.
  holding_torque_nm: 0.25
  # Measured on the bench rig, not a datasheet figure: a 10 deg elbow move
  # (~100-135 rpm peak) executes cleanly, while a 90 deg move timed at
  # ~384 rpm average stalls partway and drops the remaining steps. The real
  # collapse point sits between the two, so cap just above what is proven.
  # Raise incrementally -- and only once the motor supply is off the
  # breadboard and running full current.
  max_speed_rpm: 150         # usable ceiling before torque collapse
  rotor_inertia_g_cm2: 57
  step_angle_deg: 1.8
  microstepping: 16

# Gearboxes — THE independent variables of the twin: drive type + reduction
# ratio per joint. Everything else (efficiency, backlash, torque cap, inertia)
# is derived from the gearbox_models below. These are power-on defaults; the
# interactive UI overrides them live.
gearboxes:
  base:
    type: direct     # base is direct-driven by its NEMA 17 (no gravity torque on the yaw axis)
    ratio: 1
  shoulder:
    # Physical hardware is the 20:1 cycloidal cartridge (higher reduction on the
    # higher-load joint). Config said 15 -- with that, firmware emitted steps for
    # 15:1 against 20:1 hardware, so every shoulder move landed at 3/4 of the
    # commanded angle, and the torque model under-read the joint's real capacity.
    type: cycloidal
    ratio: 20
  elbow:
    # Was planetary 10:1 -- that never matched the build. The physical elbow is
    # the 15:1 cycloidal cartridge (16 ring pins = Zc + 1), per
    # engineering/gearboxes/README.md, which specifies cycloidal reducers for
    # both pitch joints (shoulder 20:1, elbow 15:1). With ratio 10 the firmware
    # emitted steps for 10:1 against 15:1 hardware, so every elbow move landed at
    # 2/3 of the commanded angle -- and the torque model used planetary
    # efficiency and the 3.5 Nm printed-gear cap instead of cycloidal's.
    type: cycloidal
    ratio: 15

# Characteristic models for each printable drive type. A planetary stage tops
# out around 6:1, so higher ratios stack stages and compound their losses and
# backlash. Cycloidal backlash is negligible by design assumption.
gearbox_models:
  direct:
    ratio_range: [1, 1]
    efficiency: 0.98
    backlash_deg: 0.02       # shaft coupling only
    max_torque_nm: 10.0      # no printed gears in the path
    inertia_g_cm2: 0
  planetary:
    ratio_range: [2, 25]
    max_stage_ratio: 6
    stage_efficiency: 0.75
    stage_backlash_deg: 0.6
    max_torque_nm: 3.5       # printed-gear strength cap
    stage_inertia_g_cm2: 12
  cycloidal:
    ratio_range: [8, 40]
    efficiency: 0.60
    backlash_deg: 0.0        # negligible by design assumption
    max_torque_nm: 8.0
    inertia_g_cm2: 25

# Collision geometry — conservative capsule/sphere envelopes around the real
# parts. Used to block commands that would self-collide or strike the table.
collision:
  ground_clearance_mm: 5      # minimum gap kept between any link and the table
  column_radius_mm: 34        # rotating column + base motor envelope
  column_top_mm: 70           # column capsule spans z = 0 .. this
  base_radius_mm: 78          # stationary base housing envelope
  base_top_mm: 62
  shoulder_radius_mm: 42      # shoulder joint + motor block envelope
  upper_arm_radius_mm: 26
  forearm_radius_mm: 22
  gripper_extent_mm: 75       # fingertips 71 mm beyond the TCP (gripper v2) + margin
  elbow_trim: 0.2             # forearm fraction ignored next to its own elbow joint

# Standard mechanical components the design is built around
hardware:
  bearing: "608 (8x22x7 mm)"
  shaft_mm: 8
  motor_frame: "NEMA 17 42.3x42.3x48 mm"
  printer: "Bambu Lab A1 Mini"
  build_volume_mm: [180, 180, 180]
