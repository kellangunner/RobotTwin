; RobotTwin gripper node — Arduino Uno driving the SG-90.
;
; Separate project from firmware/ on purpose: different MCU, different
; framework, and the ESP32 build must not care that this exists.
;
;   pio run                 # build
;   pio run -t upload       # flash
;   pio device monitor      # console at 115200 — "G <mm>", "GRIP <mm>", "R"
[env:uno]
platform = atmelavr
board = uno
framework = arduino

; Bake the gripper: block of config/firmware.yaml into src/gripper_config_gen.hpp
; before every build. The ESP32 parses that YAML at boot; an ATmega328P has no
; room for a parser, so it gets the same numbers resolved at compile time.
extra_scripts = pre:scripts/gen_gripper_config.py

; Servo generates the 50 Hz frames from Timer1 (which is why the signal pin has
; to be D9 or D10). SoftwareSerial ships with the AVR core; Servo does not.
lib_deps = arduino-libraries/Servo@^1.2.2

; Compile the shared rt::GripperAxis straight out of the repo core rather than
; reimplementing the slew here — the whole point is that this board and the
; ESP32 run identical math from identical calibration.
;
; -std=gnu++17 is for the designated initializers in the generated config
; header; naming the fields keeps the generator independent of the struct's
; field order.
build_src_filter = +<*> +<../../../src/hardware/gripper.cpp>
build_unflags = -std=gnu++11
build_flags = -I$PROJECT_DIR/../../src -std=gnu++17

monitor_speed = 115200
monitor_eol = LF
monitor_filters = direct
